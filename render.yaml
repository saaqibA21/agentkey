# Render Blueprint: API + Postgres + Redis-compatible Key Value. Deploy with "New > Blueprint".
# Render has no India region; Singapore is the closest. Move to AWS ap-south-1 when data
# residency in India becomes a requirement.
services:
  - type: web
    name: agentidentity-api
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agentidentity-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agentidentity-redis
          property: connectionString
      - key: ADMIN_SECRET
        generateValue: true
      - key: SIGNING_SECRET
        generateValue: true
      - key: INGEST_SECRET
        generateValue: true
      - key: DASHBOARD_SECRET
        generateValue: true
      - key: DASHBOARD_URL
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: DOMAIN_PROVIDER
        value: ses
      - key: SES_INBOUND_TOPIC_ARN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: MAIL_DOMAIN
        sync: false
      - key: SHARED_DOMAINS
        sync: false
      - key: MAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: email-smtp.ap-south-1.amazonaws.com
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  - type: keyvalue
    name: agentidentity-redis
    region: singapore
    plan: starter
    ipAllowList: []

databases:
  - name: agentidentity-db
    region: singapore
    plan: basic-256mb

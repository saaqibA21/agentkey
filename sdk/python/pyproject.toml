[project]
name = "agentkey-sdk"
version = "0.1.0"
description = "Official Python SDK for AgentKey: email, zero-token OTP extraction, and verifiable agent identity"
requires-python = ">=3.9"
dependencies = ["httpx>=0.25", "pydantic>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentkey", "agentidentity"]

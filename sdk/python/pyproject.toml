[project]
name = "agentidentity"
version = "0.1.0"
description = "Python SDK for AgentIdentity: email, WhatsApp and SMS identities for AI agents"
requires-python = ">=3.9"
dependencies = ["httpx>=0.25", "pydantic>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentidentity"]
